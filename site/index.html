<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Reference | 웹 디자인 레퍼런스 라이브러리</title>
<meta name="description" content="유명 브랜드 웹사이트의 컬러·타이포그래피·레이아웃·UI 특징을 분석해 비교하는 웹 디자인 레퍼런스 라이브러리입니다." />
<meta name="theme-color" content="#f7f5f1" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Design Reference" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:title" content="Design Reference | 웹 디자인 레퍼런스 라이브러리" />
<meta property="og:description" content="유명 브랜드 웹사이트의 컬러·타이포그래피·레이아웃·UI 특징을 분석해 비교하는 웹 디자인 레퍼런스 라이브러리입니다." />
<!-- 배포 주소가 바뀌면 아래 세 줄과 tools/build-seed.ps1의 $SiteUrl을 함께 바꾼다 -->
<link rel="canonical" href="https://enkyoon.github.io/design-guide-site/" />
<meta property="og:url" content="https://enkyoon.github.io/design-guide-site/" />
<meta property="og:image" content="https://enkyoon.github.io/design-guide-site/assets/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Cpath d='M16 6a10 10 0 0 1 0 20z' fill='%23d8ab6c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f7f5f1' stroke-width='2'/%3E%3C/svg%3E" />
<!-- 글꼴: 한글 Noto Sans KR (Google Fonts), 영문 Pretendard (css/fonts.css) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">본문으로 건너뛰기</a>

  <header class="site-header" id="site-header">
    <div class="site-header__inner">
      <a class="logo" href="#/" id="home-link">
        <span class="logo__mark" aria-hidden="true">◐</span><span id="site-name">Design Reference</span>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <button type="button" class="nav-btn" id="favorites-toggle" aria-pressed="false">
          <span class="nav-btn__star" aria-hidden="true">★</span>
          <span class="nav-btn__label">즐겨찾기</span>
          <span class="nav-btn__count" id="favorites-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- 목록 화면 (상세 화면으로 가면 통째로 숨김) -->
    <div class="list-view" id="list-view">
      <section class="hero" aria-labelledby="hero-title">
        <h1 class="hero__title" id="hero-title">웹 디자인 레퍼런스 라이브러리</h1>
        <p class="hero__text" id="site-tagline"></p>
      </section>

      <!-- 검색 · 정렬 -->
      <div class="toolbar" id="toolbar">
        <div class="search" role="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="visually-hidden" for="search-input">레퍼런스 검색</label>
          <input type="search" id="search-input" class="search__input" placeholder="브랜드, 업종, 스타일로 검색 (예: minimal, 금융, dark)" autocomplete="off" enterkeyhint="search" />
          <button type="button" class="search__clear" id="search-clear" aria-label="검색어 지우기" hidden>✕</button>
        </div>
        <button type="button" class="filter-open-btn" id="filter-open" aria-controls="filter-panel" aria-expanded="false">
          필터 <span class="filter-open-btn__count" id="filter-open-count" hidden></span>
        </button>
        <label class="visually-hidden" for="sort-select">정렬 기준</label>
        <select id="sort-select" class="sort-select"></select>
      </div>

      <!-- 필터 (데스크톱: 검색 아래 / 태블릿·모바일: 아래에서 올라오는 시트) -->
      <div class="filter-backdrop" id="filter-backdrop" hidden></div>
      <section class="filter-panel" id="filter-panel" aria-label="필터">
        <div class="filter-panel__head">
          <strong>필터</strong>
          <button type="button" class="icon-btn" id="filter-close" aria-label="필터 닫기">✕</button>
        </div>
        <div class="filter-panel__groups" id="filter-groups"></div>
        <details class="filter-more">
          <summary>상세 필터 (컬러톤 · 폰트)</summary>
          <div class="filter-panel__groups" id="filter-more-groups"></div>
        </details>
        <div class="filter-panel__foot">
          <button type="button" class="btn btn--outline" id="filter-reset">모두 지우기</button>
          <button type="button" class="btn btn--primary" id="filter-apply">결과 보기</button>
        </div>
      </section>

      <!-- 결과 개수 + 선택한 조건 -->
      <div class="result-bar">
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <span class="data-mode" id="data-mode" title="Supabase 연결 정보가 없어 data/sample-brands.js를 보여 주는 중입니다." hidden>샘플 데이터</span>
        <div class="active-filters" id="active-filters"></div>
      </div>

      <!-- 브랜드 카드 목록 -->
      <h2 class="visually-hidden">브랜드 목록</h2>
      <div class="card-grid" id="card-grid"></div>

      <!-- 불러오기 실패 / DB에 데이터가 없음 (검색 결과 없음과 구분) -->
      <div class="empty-state" id="load-state" role="status" hidden></div>

      <!-- 검색·필터 결과 없음 / 즐겨찾기 없음 (문구는 app.js에서 상황에 맞게) -->
      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-state__title" id="empty-title"></p>
        <p class="empty-state__text" id="empty-text"></p>
        <button type="button" class="btn btn--outline" id="empty-clear">모두 지우기</button>
      </div>

      <div class="load-more-wrap" id="load-more-wrap" hidden>
        <button type="button" class="btn btn--outline" id="load-more-btn">더 보기</button>
      </div>
    </div>

    <!-- 상세 화면 · 찾을 수 없음 -->
    <section class="detail-view" id="detail-view" hidden>
      <nav class="breadcrumb" id="detail-breadcrumb" aria-label="이동 경로"></nav>
      <div id="detail-content"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__name" id="footer-name">Design Reference</p>
      <p>유명 브랜드 웹사이트를 직접 살펴보고 디자인 특징을 정리한 독립적인 레퍼런스 라이브러리입니다. 분석 내용은 참고용이며, 브랜드 이름과 상표는 각 소유자에게 있습니다. 이 사이트는 소개된 브랜드와 관련이 없습니다.</p>
      <p>© 2026 Design Reference</p>
    </div>
  </footer>

  <button type="button" class="back-to-top" id="back-to-top" aria-label="맨 위로 이동" hidden>↑</button>

  <script src="js/schema.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/brand-service.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
