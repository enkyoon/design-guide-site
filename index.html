<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>국내/외 유명 사이트 디자인 가이드</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="site-header__bar">
      <button type="button" class="icon-btn" id="menu-toggle" aria-label="필터 메뉴 열기" aria-expanded="false" aria-controls="filter-bar">
        <span class="icon-btn__bars"></span>
      </button>
      <h1 class="site-header__title">국내/외 유명 사이트 디자인 가이드</h1>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="다크모드 전환">
        <span id="theme-toggle-icon">🌙</span>
      </button>
    </div>
    <p class="site-header__subtitle">테마 · 지역 · 컬러톤 · 폰트 · 분야로 살펴보는 레퍼런스 아카이브</p>
  </header>

  <div class="filter-backdrop" id="filter-backdrop" hidden></div>
  <nav class="filter-bar" id="filter-bar" hidden></nav>

  <div class="toolbar" id="toolbar">
    <input type="text" id="search-input" placeholder="사이트명, 키워드로 검색" />
    <select id="sort-select" class="sort-select" aria-label="정렬 기준">
      <option value="default">기본순</option>
      <option value="name">이름순 (가나다)</option>
      <option value="region">지역순</option>
    </select>
    <button type="button" id="favorites-toggle" class="chip">★ 즐겨찾기만</button>
    <span id="result-count"></span>
  </div>

  <main class="card-grid" id="card-grid"></main>
  <p class="empty-state" id="empty-state" hidden>조건에 맞는 사이트가 없습니다.</p>

  <div class="load-more-wrap" id="load-more-wrap" hidden>
    <button type="button" class="btn btn--outline" id="load-more-btn">더 보기</button>
  </div>

  <section class="detail-view" id="detail-view" hidden>
    <nav class="breadcrumb" id="detail-breadcrumb" aria-label="이동 경로"></nav>
    <div id="detail-content"></div>
  </section>

  <button type="button" class="back-to-top" id="back-to-top" aria-label="맨 위로 이동" hidden>↑</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data-source.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
